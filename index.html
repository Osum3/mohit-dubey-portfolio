<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mohit Dubey | Presentation Designer</title>
    <meta name="description" content="Mohit Dubey is a presentation designer with 4+ years of experience designing pitch decks, investor decks, sales and corporate presentations." />
    <meta name="theme-color" content="#F1EFF6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14111E" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Mohit Dubey | Presentation Designer" />
    <meta property="og:description" content="Presentation design for pitch decks, investor decks, sales and corporate presentations." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply the saved or system theme before first paint to avoid a flash.
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
